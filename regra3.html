  <script>
    alert("Regra de formação:\n\na ----- b\nc ----- x");

    var a = prompt("Digite o valor de a:");
    var b = prompt("Digite o valor de b:");
    var c = prompt("Digite o valor de c:");

    a = Number(a);
    b = Number(b);
    c = Number(c);

    var x = (b * c) / a;

    alert("Resultado da Regra de 3:\n\na ----- b\nc ----- x\n\nx = " + x);
  </script>
</body>
