<script>
    // Função para ler número positivo
function lerNumeroPositivo(mensagem) {
  let numero;
  do {
    const entrada = prompt(mensagem);
    numero = parseFloat(entrada);
    if (isNaN(numero) || numero <= 0) {
      alert("Por favor, informe um número válido maior que zero.");
    }
  } while (isNaN(numero) || numero <= 0);
  return numero;
}

// Leitura dos dados
const saldoInicial = lerNumeroPositivo("Informe o saldo inicial da conta bancária:");
const taxaRendimento = lerNumeroPositivo("Informe a taxa de rendimento mensal (%):");
const quantidadeMeses = lerNumeroPositivo("Informe a quantidade de meses da aplicação:");

// Variável para o saldo atualizado
let saldoAtual = saldoInicial;

// Acumula todas as mensagens para exibir depois
let mensagens = "";

// Cálculo mês a mês
for (let mes = 1; mes <= quantidadeMeses; mes++) {
  const rendimento = saldoAtual * (taxaRendimento / 100);
  saldoAtual += rendimento;

  mensagens += `No ${mes}º mês a aplicação rendeu R$ ${rendimento.toFixed(2)} e o total aplicado passou a ser R$ ${saldoAtual.toFixed(2)}\n`;
}

// Exibir resultados
alert(mensagens + `\nO saldo final da aplicação será de R$ ${saldoAtual.toFixed(2)}`);

</script>
