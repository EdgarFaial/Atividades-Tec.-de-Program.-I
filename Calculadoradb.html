<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aritmética + IndexedDB</title>
  <style>
    body {
      background-color: #252526;
      font-family: Arial, Helvetica, sans-serif;
      color: aliceblue;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-weight: 100;
      text-shadow: 0px 0px 10px aliceblue;
      font-size: 400%;
    }
    input {
      background-color: #252526;
      color: aliceblue;
      text-align: center;
      width: 100px;
      height: 30px;
      margin: 10px;
      font-size: 18px;
      border: 1px solid #ffffff;
    }
    .botoes button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      background-color: transparent;
      color: white;
      border: 1px solid #ffffff;
      transition: 0.3s;
    }
    .botoes button:hover {
      background-color: #6666668e;
      box-shadow: 0px 0px 20px #ffffff;
    }
    #resultado {
      margin-top: 20px;
      font-size: 24px;
    }
    #historico {
      margin-top: 30px;
      text-align: left;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .item-historico {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #555;
      padding: 5px;
    }
    .item-historico button {
      background-color: crimson;
      color: white;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>ARITMÉTICA</h1>
  <div>
    <input type="number" id="n1" placeholder="Número 1" />
    <input type="number" id="n2" placeholder="Número 2" />
  </div>
  <div class="botoes">
    <button onclick="calcp()">+</button>
    <button onclick="calcm()">-</button>
    <button onclick="calcmu()">×</button>
    <button onclick="calcd()">÷</button>
    <button onclick="limpar()">Limpar</button>
  </div>
  <div id="resultado">Aguardando valores...</div>
  <div id="historico"></div>
<script>
  const DB_NAME = "CalcDB";
  const DB_VERSION = 1;
  const STORE_NAME = "historico";
  let db;
  const request = indexedDB.open(DB_NAME, DB_VERSION);
  request.onerror = (event) => { console.error("Erro ao abrir DB:", event.target.errorCode); };
  request.onsuccess = (event) => { db = event.target.result; mostrarRegistros(); };
  request.onupgradeneeded = (event) => {
    db = event.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
      db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
    }
  };
  function pegarValores() {
    const n1 = parseFloat(document.getElementById("n1").value);
    const n2 = parseFloat(document.getElementById("n2").value);
    return [n1, n2];
  }
  function validarInputs(n1, n2) {
    if (isNaN(n1) || isNaN(n2)) {
      document.getElementById("resultado").innerText = "Preencha ambos os campos.";
      return false;
    }
    return true;
  }
  function salvarNoDB(operando1, operando2, operacao, resultado) {
    const transaction = db.transaction([STORE_NAME], "readwrite");
    const store = transaction.objectStore(STORE_NAME);
    store.add({ operando1, operando2, operacao, resultado });
    transaction.oncomplete = () => mostrarRegistros();
  }
  function calcp() {
    const [n1, n2] = pegarValores();
    if (!validarInputs(n1, n2)) return;
    const res = n1 + n2;
    document.getElementById("resultado").innerText = `${n1} + ${n2} = ${res}`;
    salvarNoDB(n1, n2, "+", res);
  }
  function calcm() {
    const [n1, n2] = pegarValores();
    if (!validarInputs(n1, n2)) return;
    const res = n1 - n2;
    document.getElementById("resultado").innerText = `${n1} - ${n2} = ${res}`;
    salvarNoDB(n1, n2, "-", res);
  }
  function calcmu() {
    const [n1, n2] = pegarValores();
    if (!validarInputs(n1, n2)) return;
    const res = n1 * n2;
    document.getElementById("resultado").innerText = `${n1} × ${n2} = ${res}`;
    salvarNoDB(n1, n2, "×", res);
  }
  function calcd() {
    const [n1, n2] = pegarValores();
    if (!validarInputs(n1, n2)) return;
    if (n2 === 0) {
      document.getElementById("resultado").innerText = "Erro: divisão por zero.";
      return;
    }
    const res = n1 / n2;
    document.getElementById("resultado").innerText = `${n1} ÷ ${n2} = ${res}`;
    salvarNoDB(n1, n2, "÷", res);
  }
  function limpar() {
    document.getElementById("n1").value = "";
    document.getElementById("n2").value = "";
    document.getElementById("resultado").innerText = "Aguardando valores...";
    const transaction = db.transaction([STORE_NAME], "readwrite");
    const store = transaction.objectStore(STORE_NAME);
    store.clear();
    transaction.oncomplete = () => mostrarRegistros();
  }
  function mostrarRegistros() {
    const historicoDiv = document.getElementById("historico");
    historicoDiv.innerHTML = "<h3>Histórico:</h3>";
    const transaction = db.transaction([STORE_NAME], "readonly");
    const store = transaction.objectStore(STORE_NAME);
    store.openCursor().onsuccess = (event) => {
      const cursor = event.target.result;
      if (cursor) {
        const item = cursor.value;
        historicoDiv.innerHTML += `
          <div class="item-historico">
            <span>${item.operando1} ${item.operacao} ${item.operando2} = ${item.resultado}</span>
            <button onclick="remover(${item.id})">X</button>
          </div>`;
        cursor.continue();
      }
    };
  }
  function remover(id) {
    const transaction = db.transaction([STORE_NAME], "readwrite");
    const store = transaction.objectStore(STORE_NAME);
    store.delete(id);
    transaction.oncomplete = () => mostrarRegistros();
  }
</script>
</body>
</html>
